<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="planner-shell">
    <section class="planner-card" aria-labelledby="page-title">
      <header class="planner-header">
        <div>
          <p class="eyebrow">Your day, in focus</p>
          <h1 id="page-title">Daily planner</h1>
          <p id="current-date" class="current-date"></p>
        </div>
        <div class="day-mark" aria-hidden="true">☀</div>
      </header>

      <form id="task-form" class="task-form" novalidate>
        <label class="visually-hidden" for="task-input">Add a task</label>
        <input id="task-input" class="form-control" type="text" maxlength="160" placeholder="What needs your attention?" autocomplete="off">
        <button class="btn add-button" type="submit">Add task <span aria-hidden="true">+</span></button>
      </form>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

      <div class="toolbar" aria-label="Task filters">
        <div class="filter-group" role="group" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">Pending</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <p id="task-count" class="task-count">0 tasks</p>
      </div>

      <div id="task-list" class="task-list" aria-live="polite"></div>
    </section>
    <p class="footer-note">Small steps make a clear day.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
